; Home Assistant bedroom controller firmware for the CYD — ESP32-2432S028R
; (ESP32-WROOM-32, 2.8" ILI9341 320x240 SPI TFT, XPT2046 resistive touch)
;
; The TFT_eSPI wiring and driver flags below are carried verbatim from the
; sibling ../btcticker-cyd project, which was tuned against THIS physical unit.
; Do not "clean them up" without re-testing on hardware — see the notes.

; `pio run` / `pio run -t upload` build the real firmware. To recalibrate touch:
;   pio run -e calib -t upload     # tap the 4 crosshairs, read the serial output
; then paste the printed TOUCH_* block into include/config.h and reflash env:cyd.
[platformio]
default_envs = cyd

[env]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Anything faster than 115200 caused serial noise / corruption while flashing
; this board (see ../btcticker-cyd/CLAUDE.md).
upload_speed = 115200
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
; WiFiManager + TFT_eSPI overflow the default OTA partition table
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17
    ; Used only for its begin()/setCalibration() pin setup — every actual
    ; sample goes through the hand-rolled xptRead() in main.cpp. Hardware VSPI
    ; + TFT_eSPI TOUCH_CS fought over the same CS pin and left touch dead on
    ; many CYD units, so the read path is bit-banged instead.
    nitek/XPT2046_Bitbang_Slim@^2.0.0

build_flags =
    ; ---- TFT_eSPI wiring for the ESP32-2432S028R (single-USB CYD) ----
    ; White screen on boot usually means the dual-USB board variant, which
    ; needs -D ST7789_DRIVER instead of ILI9341_2_DRIVER.
    ; Do NOT define TOUCH_CS here — touch is bit-banged on its own pins
    ; (see config.h); letting TFT_eSPI own CS 33 breaks that path.
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; This unit's panel swaps red/blue (whites render cyan, orange renders
    ; yellow-green). Critical here: without it the warm/cool colour-temp
    ; swatches would render as the wrong colours entirely.
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; ── the real firmware ──
[env:cyd]

; ── touch calibration utility ──
; Draws 4 crosshairs, records the raw ADC value at each, and prints a
; ready-to-paste TOUCH_* block. Use this instead of guessing at the ranges —
; the inherited btcticker values collapsed every tap into the left third.
[env:calib]
build_flags = ${env.build_flags} -D CALIB_MODE=1
