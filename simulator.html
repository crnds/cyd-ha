<!doctype html>
<meta charset="utf-8">
<title>cyd-ha layout simulator</title>
<style>
  body { background:#0e1116; color:#a6b0c2; font:13px/1.55 ui-monospace,Menlo,monospace;
         margin:0; padding:24px; display:flex; gap:28px; flex-wrap:wrap; }
  /* Square, like the panel it frames — a rounded bezel around a hard-cornered UI
     misreports the one thing this file exists to show. Same for the buttons. */
  canvas { image-rendering:pixelated; border:1px solid #2f343e; }
  h1 { font-size:13px; color:#f4f6fa; margin:0 0 6px; letter-spacing:.09em;
       text-transform:uppercase; }
  .panel { max-width:390px; }
  .row { margin:12px 0; }
  label { display:block; color:#707a8c; font-size:11px; letter-spacing:.08em;
          text-transform:uppercase; margin-bottom:4px; }
  input[type=range] { width:100%; }
  button { background:#23272f; color:#a6b0c2; border:0;
           padding:6px 10px; font:inherit; cursor:pointer; margin:0 2px 3px 0; }
  button:hover { background:#18bcf2; color:#07090d; }
  #log { white-space:pre-wrap; color:#707a8c; font-size:11px; margin-top:12px; }
  .warn { color:#ff4d6a; }
  .ok { color:#2fd97c; }
  .hd { color:#f4f6fa; }
</style>

<div>
  <h1>CYD 320&times;240 &mdash; 1&times;</h1>
  <canvas id="c" width="320" height="240"></canvas>
</div>

<div class="panel">
  <h1>Simulated state</h1>
  <p>Click the canvas. Tabs, chips, swatches, the AC stepper, scene tiles, the
     scroll gutter and settings rows all run the same hit-test geometry as
     <code>screenHitTest()</code>, including the AC row's reversed stepper slots.</p>
  <div class="row">
    <label>Device state</label>
    <button onclick="setAll(true)">all bulbs on</button>
    <button onclick="setAll(false)">all bulbs off</button>
    <button onclick="stale=!stale;draw()">toggle stale</button>
    <button onclick="haOk=!haOk;draw()">toggle HA down</button>
    <button onclick="wifiOk=!wifiOk;if(!wifiOk)haOk=false;draw()">toggle Wi-Fi down</button>
  </div>
  <div class="row">
    <button onclick="dev[1].avail=!dev[1].avail;draw()">bulb 2 unavailable</button>
    <button onclick="dev[2].ct=!dev[2].ct;draw()">bulb 3 no colour temp</button>
    <button onclick="errFlash()">flash a failed call</button>
    <button onclick="cycleMode()">cycle AC mode</button>
  </div>
  <div class="row">
    <label>Long device name &mdash; exercises textTrunc()</label>
    <button onclick="dev[0].name='1';draw()">default</button>
    <button onclick="dev[0].name='TRADFRI BULB 1';draw()">14 chars</button>
    <button onclick="dev[0].name='Bedside reading lamp, left';draw()">long</button>
    <button onclick="dev[0].name='Reading lamp (gy)';draw()">descenders</button>
  </div>
  <div class="row">
    <label>Scene table size &mdash; the scroll gutter only appears past 6</label>
    <button onclick="sceneStress(0)">5 scenes</button>
    <button onclick="sceneStress(19)">24 scenes</button>
    <button onclick="sceneStress(95)">100 scenes</button>
  </div>
  <div class="row">
    <label>Bulb 1 brightness &mdash; off-preset levels test the tolerances</label>
    <input type="range" min="0" max="100" value="30"
           oninput="dev[0].pct=+this.value;dev[0].on=+this.value>0;draw()">
  </div>
  <div class="row">
    <label>Bulb 3 colour temp &mdash; the card icon interpolates, chips bucket</label>
    <input type="range" min="2202" max="4000" value="4000"
           oninput="dev[2].kelvin=+this.value;draw()">
  </div>
  <div id="log"></div>
</div>

<script>
// ── GEOMETRY: mirrors the LAYOUT block of include/config.h ────────────────────
// Keep these in sync. The whole point of this file is that a layout change can be
// checked — including for clipping, which needs the REAL font metrics below — well
// before spending a flash cycle.
const SCR_W=320, SCR_H=240;
const SP_1=4, SP_2=8, SP_3=12, SP_4=16, SP_6=24;
// No radius token: corners are square everywhere, so rect() takes no r.

// header — anchored to the BOTTOM edge, not the top. Moved on request; the
// divider is now at the TOP of the band (the seam with the body above it), and
// content sits below it, mirrored from the old top-anchored layout.
// THREE regions, tiling the bar exactly (80 + 171 + 69 = 320):
//   room reading  x   0.. 79   STATUS_ROOM_W, left edge
//   tab strip     x  80..250   TAB_STRIP_W, the tabs CENTRED in it
//   clock         x 251..319   STATUS_CLK_W, right edge
// ROOM | TABS | CLOCK is a swap, on request — it used to be tabs | room | clock
// with the strip flush left at x 0. Same widths, new order. The 26px connectivity
// glyph that once sat at x 0..25 is gone, replaced by the NOCONN_* body overlay.
//
// BOTH NUMBER REGIONS ARE F_NUM — up a size on request, spending the 26px the
// glyph freed plus 8px from a TAB_GAP cut (12->8, still on the SP_* scale; it
// went 18->12 for the previous bump). There is no size between F_TITLE and F_NUM
// — TFT_eSPI has no Font 3 or 5 — so "one size up" is 1.8x the width.
// STATUS_EDGE_DX is the blank at each outer edge, mirrored: the clock's right
// margin and the room reading's left one.
//   clock 69 = "23:45"(63) + 6 edge, zero left slack
//   room  80 = 6 edge + "27"(28) + ring(5) + gap(4) + "99"(28) + "%"(9) = 80
// The room's zero slack is fine: the tab strip's 2px margin + TAB_LBL_DX are the
// gap to "Devices". A reading too wide for it drops its digits to TITLE rather
// than spill into the tab strip, which (unlike the clock) never repaints it away.
// Two pieces deliberately did NOT grow: "%" stays TITLE (F_NUM's is 21px) and is
// drawn BASELINE-ALIGNED to the big digits, and the ring stays a 2px circle to
// match the one wValue() draws beside the AC setpoint. The trailing "/" is GONE.
// Humidity's budget is still 2 digits, not 3 ("100%") — an indoor AC'd bedroom
// sensor doesn't read 100% RH any more than the room reads -10C.
const STATUS_H=32, STATUS_Y0=SCR_H-STATUS_H, TAB_GAP=SP_2,
      TAB_COUNT=3, STATUS_CLK_W=69, STATUS_ROOM_W=80, STATUS_EDGE_DX=6,
      TAB_X0=STATUS_ROOM_W,
      TAB_STRIP_W=SCR_W-STATUS_ROOM_W-STATUS_CLK_W,
      STATUS_DIV_Y=STATUS_Y0, STATUS_CY=STATUS_DIV_Y+16;
// Underline indicator, seated on the header rule FROM BELOW now (the rule is at
// the top of the band). 2px so "Settings"' descenders keep clear of it —
// asserted below, not assumed.
const TAB_UL_H=2, TAB_UL_Y=STATUS_DIV_Y+1, TAB_UL_PAD=2, TAB_LBL_DX=SP_1,
      TAB_TAP_H=STATUS_H;

// body / cards — y 0..207 now that the header has moved off the top.
const ROWS_Y0=0, ROW_H=52;
const CARD_DY=2, CARD_H=ROW_H-2*CARD_DY, CARD_X=SP_2, CARD_W=SCR_W-2*SP_2,
      CARD_PAD=SP_2, CARD_IN_X0=CARD_X+CARD_PAD, CARD_IN_X1=CARD_X+CARD_W-CARD_PAD-1,
      CARD_IN_W=CARD_W-2*CARD_PAD;
// STACKED card internals — the Settings brightness card ONLY now. Every device
// card (bulbs and the AC) is inline and uses the BULB_* block below.
const CARD_L1_CY=8, CARD_L1_Y=1, CARD_L1_H=19,
      CARD_ICO_CX=CARD_X+15, CARD_ICO_R=7, CARD_TXT_X=CARD_X+28,
      CTL_DY=20, CTL_H=26;

// Connectivity overlay — BODY, not header, and the only thing here that is not
// laid out BY the row grid but ON it. It CLEARS THE WHOLE OF ROW BAND 0 and
// centres the banner in it, which is what stops fragments of the row underneath
// reading as a clipping bug. Declared after CTL_H because it borrows a chip's
// height. See config.h for the full reasoning, including why Scenes' 64px tiles
// on a 72px pitch are the accepted cost of picking the row grid.
const NOCONN_H=CTL_H, NOCONN_W=114, NOCONN_X0=(SCR_W-NOCONN_W)/2,
      NOCONN_Y0=ROWS_Y0+(ROW_H-NOCONN_H)/2;

// control grids. CHIP_* is the Settings brightness row alone now — the bulb rows
// went inline and carry their own narrower chip, so the two pages no longer
// share a pitch (43x40 against 54x26).
const CHIP_W=54, CHIP_GAP=SP_1, CHIP_PITCH=CHIP_W+CHIP_GAP;
// Bulb card, one inline row: 44 identity + 4*43 chips + 3*4 gaps + 2*30 swatches
// = 288 = CARD_IN_W. The swatches did not move when the row went inline — the
// identity column takes exactly what the four chips gave up, so SW_X0 is 244
// either way.
const BULB_ID_W=44, BULB_CTL_X0=CARD_IN_X0+BULB_ID_W, BULB_CHIP_W=43,
      BULB_CHIP_PITCH=BULB_CHIP_W+CHIP_GAP,
      BULB_NAME_W=BULB_CTL_X0-SP_1-CARD_TXT_X,
      BULB_CTL_DY=4, BULB_CTL_H=CARD_H-2*BULB_CTL_DY;
const SW_X0=BULB_CTL_X0+4*BULB_CHIP_PITCH-CHIP_GAP, SW_CELL_W=30, SW_R=13;
// AC card, inline like a bulb: 3 mode chips + stepper now tile the SAME 244px
// (CARD_IN_W - BULB_ID_W) a bulb's chips+swatches fill, starting at
// BULB_CTL_X0 rather than CARD_IN_X0. ACM_W dropped 60->43 (coincidentally
// equal to BULB_CHIP_W). ACS_X0 leaves a CHIP_GAP after the 3rd chip (DRY)
// before the stepper, same as every other chip-to-chip seam on the row —
// ACS_VAL_W gave back 4px (51->47) to buy that gap rather than removing it.
const ACM_W=43, ACM_PITCH=ACM_W+CHIP_GAP,
      ACS_X0=BULB_CTL_X0+3*ACM_PITCH, ACS_BTN_W=28, ACS_VAL_W=47;
// The AC's room reading used to stack two more lines here (temp/humidity)
// under its name — that moved to the header (STATUS_ROOM_W above) on
// request, so the AC's identity column is back to a bulb's plain single line.

// settings
const SET_ROWS=4, SET_ROW_BRI=0, SET_ROW_NIGHT=1, SET_ROW_VOL=2, SET_ROW_TGL=3;
const NIGHT_CHIPS=3;
const SET_TGLS=2, SET_TGL_SCHED=0, SET_TGL_FLIP=1;
const TGL_CARD_GAP=SP_1, TGL_CARD_W=(CARD_W-TGL_CARD_GAP)>>1,
      TGL_CARD_PITCH=TGL_CARD_W+TGL_CARD_GAP,
      TGL_SPLIT_X=CARD_X+TGL_CARD_W+(TGL_CARD_GAP>>1);
const TOGGLE_W=44, TOGGLE_H=24, TOGGLE_DX=TGL_CARD_W-CARD_PAD-1-TOGGLE_W,
      TOGGLE_DY=(CARD_H-TOGGLE_H)>>1, TGL_PAD=3;

// Devices 0..2 are the bulbs, device 3 is the AC. Declared BEFORE the scenes
// block, unlike config.h's original order, because SCENE_AC_SLOT derives from
// NUM_BULBS and a JS `const` is not hoisted for use — below it, that is a TDZ
// ReferenceError at load rather than a C-style textual expansion.
const NUM_DEVICES=4, NUM_BULBS=3, BULB_BTNS=6, AC_BTNS=6;
const AC_BTN_TUP=3, AC_BTN_TEMP=4, AC_BTN_TDN=5;

// scenes — TWO visible rows now, with the AC card in the row band below them
const SCENE_COLS=3, SCENE_VIS_ROWS=2, SCENE_TILE_W=88, SCENE_TILE_H=64,
      SCENE_X0=SP_2, SCENE_GAP_X=SP_3, SCENE_GAP_Y=SP_2,
      SCENE_PITCH_X=SCENE_TILE_W+SCENE_GAP_X, SCENE_PITCH_Y=SCENE_TILE_H+SCENE_GAP_Y,
      SCENE_PER_PAGE=SCENE_COLS*SCENE_VIS_ROWS;
const SCENE_PIP_DY=19, SCENE_PIP_R=4, SCENE_PIP_GAP=16, SCENE_NAME_DY=42;
// The AC's row band on this page: the same slot, and so the same rect, it
// occupies on Devices. _Y0 is its FIRST pixel (156) — the grid stops at or
// before it and the scroll gutter stops with it, since the card runs to x 311
// and so passes under the gutter's column.
const SCENE_AC_SLOT=NUM_BULBS, SCENE_AC_Y0=ROWS_Y0+SCENE_AC_SLOT*ROW_H;
const SCENE_SB_X0=300, SCENE_SB_W=SCR_W-SCENE_SB_X0, SCENE_SB_MID=(ROWS_Y0+SCENE_AC_Y0)>>1;
const BRI_STEPS=5, BRI_LABEL=['1%','25%','50%','75%','100%'];
const VOL_STEPS=4, VOL_LABEL=['0%','33%','67%','100%'];
const BRI_LOW=1, BRI_MID=30, BRI_HIGH=100;
const KELVIN_WARM=2202, KELVIN_COOL=4000;
const PCT_LOW_MAX=5, PCT_MID_MIN=25, PCT_MID_MAX=35, PCT_HIGH_MIN=95;
const KELVIN_WARM_MAX=2500, KELVIN_COOL_MIN=3700;
const PAGE_DEVICES=0, PAGE_SCENES=1, PAGE_SETTINGS=2;
const TAB_LABEL=['Devices','Scenes','Settings'];

// ── TYPE: exact width tables from TFT_eSPI's BUILT-IN bitmap fonts ────────────
// Generated by scripts/font_metrics.py straight out of Font16.c / Font32rle.c,
// so textW() here is BYTE-IDENTICAL to tft.textWidth() on the device. That is
// what makes the clipping warnings below trustworthy — an earlier simulator
// approximated with a CSS font and could neither confirm nor deny a 1px
// overflow. Re-run the script if a role is ever pointed at a different face.
//
//   F_BODY   Font 2 (16px box)  ink cy-5..cy+7   baseline cy+5   caps 10px
//   F_TITLE  Font 2 (16px box)  ink cy-5..cy+7   baseline cy+5   caps 10px
//   F_NUM    Font 4 (26px box)  ink cy-8..cy+15  baseline cy+10  caps 18px
//   F_MICRO  Font 1 (GLCD 6x8)  ink cy-4..cy+3   baseline cy+3   caps  7px
//
// BODY and TITLE are the SAME TABLE, and that is not a copy-paste slip: the
// built-in set has no bold, so the two roles share Font 2 and the title/state
// hierarchy is carried by colour tier alone. See src/ui/gfx.h.
const ADV={

};

// its ROLE_DY offset is folded in. Not baseline-relative ascent/descent: a
// built-in face's ink sits inset in the box TFT_eSPI centres, by a different
// amount top and bottom, so "where does the ink start" has to be stated directly.
const INK_TOP={BODY:-5,TITLE:-5,NUM:-8,MICRO:-4};
const INK_BOT={BODY:7,TITLE:7,NUM:15,MICRO:3};
const BASE={BODY:5,TITLE:5,NUM:10,MICRO:3};
// Top of the GLYPH BOX relative to cy — i.e. TFT_eSPI's own datum arithmetic
// (cy - height/2) with gfx.cpp's ROLE_DY already folded in. Everything else about
// placement falls out of the glyph data, so this is the only positioning number.
const BOXTOP={BODY:-8,TITLE:-8,NUM:-9,MICRO:-4};
const ROLE_FONT={BODY:'F2',TITLE:'F2',NUM:'F4',MICRO:'F1'};

// Real glyph data for TFT_eSPI's built-in faces, so the canvas below draws
// the same pixels the panel does. Font 2 is a row bitmap, Font 4 is 8-bit
// RLE, Font 1 (GLCD) is 5 column bytes per char; all three decoders mirror
// TFT_eSPI::drawChar. Chars 0x20..0x7E only — the UI draws nothing else.

// Decoded glyphs, memoised: the scene page at 100 tiles asks for the same
// handful of characters hundreds of times per draw.
const _gcache=new Map();
function glyphRows(key,code){
  const ck=key+code; let r=_gcache.get(ck);
  if(r) return r;
  const F=GLYPHS[key];
  if(key==='F1'){
    // GLCD: 5 column bytes, bit N = row N, plus the blank 6th column drawChar adds.
    const o=(code-0x20)*5; r=[];
    for(let y=0;y<8;y++){
      const row=[];
      for(let x=0;x<5;x++) row.push((F.b[o+x]>>y)&1);
      row.push(0);
      r.push(row);
    }
  } else if(key==='F2'){
    // Row bitmap, MSB left, each row padded to (w+6)/8 bytes — drawChar's own
    // odd rounding, not (w+7)/8.
    const i=code-0x20, w=F.w[i], s=F.o[i], bpr=(w+6)>>3; r=[];
    for(let y=0;y<F.h;y++){
      const row=[];
      for(let k=0;k<bpr;k++){
        const b=F.b[s+y*bpr+k];
        for(let j=7;j>=0;j--) row.push((b>>j)&1);
      }
      r.push(row.slice(0,w));
    }
  } else {
    // Font 4: 8-bit RLE. High bit set => (b&0x7F)+1 ink pixels, else b+1 blank.
    const i=code-0x20, w=F.w[i], e=F.o[i+1], px=[], total=w*F.h;
    let p=F.o[i];
    while(px.length<total && p<e){
      const b=F.b[p++], n=(b&0x7F)+1;
      for(let k=0;k<n;k++) px.push(b&0x80?1:0);
    }
    r=[];
    for(let y=0;y<F.h;y++) r.push(px.slice(y*w,(y+1)*w));
  }
  _gcache.set(ck,r);
  return r;
}

function advOf(role,code){
  if(role==='MICRO') return 6;
  const t=ADV[role], i=code-0x20;
  return (i>=0&&i<t.length)?t[i]:0;
}
function textW(role,s){
  if(!s) return 0;
  let w=0;
  for(const ch of s) w+=advOf(role,ch.charCodeAt(0));
  return w;
}
// Draws the panel's ACTUAL pixels: same glyph data, same decoders, same advances
// as TFT_eSPI::drawChar. So unlike every previous version of this file, what you
// see here is what the panel shows — not an outline face standing in for a
// bitmap one. Runs of set pixels are coalesced into one fillRect per run.
function gtext(role,s,x,cy,align,colour){
  if(!s) return 0;
  const w=textW(role,s);
  let sx = align==='right' ? x-w : align==='center' ? Math.round(x-w/2) : x;
  const key=ROLE_FONT[role], top=cy+BOXTOP[role];
  g.fillStyle=colour;
  for(const ch of s){
    const code=ch.charCodeAt(0);
    if(code>=0x20 && code<=0x7E){
      const rows=glyphRows(key,code);
      for(let y=0;y<rows.length;y++){
        const row=rows[y]; let run=0;
        for(let px=0;px<=row.length;px++){
          if(px<row.length && row[px]) run++;
          else if(run){ g.fillRect(sx+px-run,top+y,run,1); run=0; }
        }
      }
    }
    sx += advOf(role,code);
  }
  return w;
}
// Mirrors textFit(): role, then a shorter alt, then MICRO. Every fallback is
// reported, because a fallback on the device means a label the designer did not
// choose.
function textFit(role,s,alt,cx,cy,maxW,colour,what){
  if(textW(role,s)<=maxW){ gtext(role,s,cx,cy,'center',colour); return; }
  if(alt && textW(role,alt)<=maxW){
    warn(`${what}: "${s}" needs ${textW(role,s)}px of ${maxW}px -> falls back to "${alt}"`);
    gtext(role,alt,cx,cy,'center',colour); return;
  }
  warn(`${what}: "${s}" needs ${textW(role,s)}px of ${maxW}px -> falls back to MICRO`);
  gtext('MICRO',s,cx,cy,'center',colour);
}
// Mirrors textTrunc(): drop characters, append "..".
function textTrunc(role,s,x,cy,maxW,colour,what){
  if(textW(role,s)<=maxW){ gtext(role,s,x,cy,'left',colour); return; }
  let n=s.length;
  while(n>0){
    const t=s.slice(0,n)+'..';
    if(textW(role,t)<=maxW){
      warn(`${what}: "${s}" truncated to "${t}" (${maxW}px budget)`);
      gtext(role,t,x,cy,'left',colour); return;
    }
    n--;
  }
  warn(`${what}: "${s}" does not fit at all (${maxW}px budget) -> drawn nothing`);
}

const to565=h=>((parseInt(h.slice(1,3),16)&0xF8)<<8)|

                (parseInt(h.slice(5,7),16)>>3);
function from565(v){
  const r=Math.round(((v>>11)&0x1F)*255/31),
        gg=Math.round(((v>>5)&0x3F)*255/63),
        b=Math.round((v&0x1F)*255/31);
  return '#'+[r,gg,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// Byte-for-byte the firmware's redOnly(): luminance into the red channel only.
function redOnly(c){
  const r8=Math.floor((((c>>11)&0x1F)*255+15)/31),
        g8=Math.floor((((c>>5)&0x3F)*255+31)/63),
        b8=Math.floor(((c&0x1F)*255+15)/31);

// Byte-for-byte the firmware's warmShift(): green/blue scaled down, red

const NIGHT_SHIFT_GREEN_PCT=45, NIGHT_SHIFT_BLUE_PCT=10;

        b8=Math.floor(((c&0x1F)*255+15)/31);

        b5=((Math.floor(b8*NIGHT_SHIFT_BLUE_PCT/100))&0xF8)>>3;

function applyTheme(mode){

    if(mode===1)      C[name]=from565(ovr===null?redOnly(to565(day)):ovr);
    else if(mode===2) C[name]=from565(shiftOvr===null?warmShift(to565(day)):shiftOvr);

}

// failure — a pair that must be told apart landing on one value — so those are
// errors; the intended SURFACE/DIVIDER/ELEVATED huddle is reported, not flagged.
// NEUTRAL/ELEVATED is "is OFF selected?" and NEUTRAL/ACCENT is "selected off vs
// selected on" — both are chip fills a reader compares directly, so both have to
// survive the collapse to red.
const MUST_DIFFER=[['DIM','ERROR'],['SUCCESS','ACCENT'],['WARM','COOL'],
                   ['TEXT','TEXT2'],['TEXT2','TEXT3'],['TEXT3','DISABLED'],
                   ['NEUTRAL','ELEVATED'],['NEUTRAL','ACCENT'],
                   // BRI is a bulb card's own selected-chip fill, so it has to
                   // survive red-only night mode against every other fill that
                   // can appear on the same card: OFF's neutral grey, the
                   // shared accent (a colour-temp swatch), and the warm/cool
                   // swatch discs themselves.
                   ['BRI','NEUTRAL'],['BRI','ACCENT'],['BRI','WARM'],['BRI','COOL'],
                   // DOWN is the AC stepper's down chevron; ERROR is the same
                   // stepper's up chevron, right beside it — the one pair this
                   // token exists for has to survive both night modes.
                   ['DOWN','ERROR'],['DOWN','COOL'],['DOWN','ACCENT']];
function checkNightLadder(){
  const lvl={};
  for(const [name,day,ovr] of THEME_LIST)
    lvl[name]=((ovr===null?redOnly(to565(day)):ovr)>>11)&0x1F;
  const seen={};
  for(const k in lvl){
    if(seen[lvl[k]]!==undefined) warn(`night palette: ${k} and ${seen[lvl[k]]} both map to red level ${lvl[k]}`);
    seen[lvl[k]]=k;
  }
  for(const [a,b] of MUST_DIFFER){
    const d=Math.abs(lvl[a]-lvl[b]);
    if(d<2) warn(`night palette: ${a} and ${b} are ${d} step(s) apart and must be told apart`);
  }
  return Object.keys(lvl).sort((a,b)=>lvl[a]-lvl[b]).map(k=>`${k} ${lvl[k]}`).join(' < ');
}
// Shift's output is NOT monochrome (unlike redOnly()'s), so a single red-level
// ladder can't certify it: WARM/COOL are told apart mainly by the red channel
// despite similar luminance, while DIM/ERROR differ by hue at a small
// luminance gap. Check (a) all 18 values pairwise-unique and (b) a per-channel
// delta on the same MUST_DIFFER pairs, not a single blended number.
function checkShiftDistinct(){
  const val={};
  for(const [name,day,,shiftOvr] of THEME_LIST)
    val[name]=shiftOvr===null?warmShift(to565(day)):shiftOvr;
  const seen={};
  for(const k in val){
    if(seen[val[k]]!==undefined) warn(`shift palette: ${k} and ${seen[val[k]]} collide at 0x${val[k].toString(16)}`);
    seen[val[k]]=k;
  }
  for(const [a,b] of MUST_DIFFER){
    const ca=val[a], cb=val[b];
    const dR=Math.abs(((ca>>11)&0x1F)-((cb>>11)&0x1F));
    const dG=Math.abs(((ca>>5)&0x3F)-((cb>>5)&0x3F));
    const dB=Math.abs((ca&0x1F)-(cb&0x1F));
    if(Math.max(dR,dG,dB)<4) warn(`shift palette: ${a} and ${b} differ by at most dR=${dR} dG=${dG} dB=${dB} — too close on every channel`);
  }
  return Object.keys(val).map(k=>`${k} 0x${val[k].toString(16).padStart(4,'0')}`).join('  ');
}

function mix(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [ar,ag,ab]=p(a),[br,bg,bb]=p(b);
  const c=(x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,'0');
  return `#${c(ar,br)}${c(ag,bg)}${c(ab,bb)}`;
}
const tint=c=>mix(C.BG,c,56/255);

// ── geometry helpers, mirroring screen.cpp ───────────────────────────────────
function btnCount(d){ return d.kind==='climate'?AC_BTNS:BULB_BTNS; }
const rowTop  = i => ROWS_Y0+i*ROW_H;
const cardTop = i => rowTop(i)+CARD_DY;

// so a later repaint underneath would land on top of it and no compare would put

// The one function that knows the two row kinds lay out the same six slots
// differently IN X — including the AC stepper's slot order, DOWN left / UP
// right (5 left, 3 right) on request. They share one Y band now
// (BULB_CTL_DY/BULB_CTL_H): the AC's control row used to sit in its own
// shorter strip under a separate state line, out of step with the bulb rows
// around it; that is gone along with its stacked layout.
function btnRect(i,b){
  const y=cardTop(i)+BULB_CTL_DY, h=BULB_CTL_H;
  if(dev[i].kind==='climate'){
    if(b<3) return {x:BULB_CTL_X0+b*ACM_PITCH, y, w:ACM_W, h};
    if(b===AC_BTN_TDN)  return {x:ACS_X0,                       y, w:ACS_BTN_W, h};
    if(b===AC_BTN_TEMP) return {x:ACS_X0+ACS_BTN_W,             y, w:ACS_VAL_W, h};
    return {x:ACS_X0+ACS_BTN_W+ACS_VAL_W,                       y, w:ACS_BTN_W, h};
  }
  if(b<4) return {x:BULB_CTL_X0+b*BULB_CHIP_PITCH, y, w:BULB_CHIP_W, h};
  return {x:SW_X0+(b-4)*SW_CELL_W, y, w:SW_CELL_W, h};
}
function briRect(b){
  return {x:CARD_IN_X0+b*CHIP_PITCH, y:cardTop(SET_ROW_BRI)+CTL_DY, w:CHIP_W, h:CTL_H};
}
function nightRect(c){
  return {x:CARD_IN_X0+c*CHIP_PITCH, y:cardTop(SET_ROW_NIGHT)+CTL_DY, w:CHIP_W, h:CTL_H};
}
function volRect(v){
  return {x:CARD_IN_X0+v*CHIP_PITCH, y:cardTop(SET_ROW_VOL)+CTL_DY, w:CHIP_W, h:CTL_H};
}

function pctMatches(want,got){
  if(want>=BRI_HIGH) return got>=PCT_HIGH_MIN;
  if(want>=BRI_MID)  return got>=PCT_MID_MIN && got<=PCT_MID_MAX;
  return got>=0 && got<=PCT_LOW_MAX;
}
function kelvinMatches(want,got){
  return want<=KELVIN_WARM_MAX ? (got>0 && got<=KELVIN_WARM_MAX) : (got>=KELVIN_COOL_MIN);
}
function btnActive(d,b){
  if(!d.avail) return false;
  if(d.kind==='climate') return b===0?d.mode==='off':b===1?d.mode==='cool':b===2?d.mode==='dry':false;
  if(!d.on) return b===0;
  if(b===1) return pctMatches(BRI_LOW,d.pct);
  if(b===2) return pctMatches(BRI_MID,d.pct);
  if(b===3) return pctMatches(BRI_HIGH,d.pct);
  if(b===4) return d.ct && kelvinMatches(KELVIN_WARM,d.kelvin);
  if(b===5) return d.ct && kelvinMatches(KELVIN_COOL,d.kelvin);
  return false;
}
// Derived every draw, never latched — same as sceneActive() in screen.cpp.
function sceneActive(idx){
  if(idx>=SCENE.length) return false;
  for(let i=0;i<NUM_BULBS;i++){
    const d=dev[i], w=SCENE[idx].b[i];
    if(!d.known || !d.avail) return false;
    if(!w.on){ if(d.on) return false; continue; }
    if(!d.on) return false;
    if(d.pct<0 || !pctMatches(w.pct,d.pct)) return false;
    if(w.kelvin>0 && d.ct){
      if(!(d.kelvin>0) || !kelvinMatches(w.kelvin,d.kelvin)) return false;
    }
  }
  return true;
}

// ── primitives ───────────────────────────────────────────────────────────────
// Every container and control on the panel is a plain rect — there is no radius
// token any more, so this replaced roundRect() outright rather than taking a 0.
// The stroke is inset by half a pixel so a 1px border lands ON x..x+w-1 exactly
// like TFT_eSPI's drawRect, instead of straddling the boundary and coming out
// two antialiased rows wide at S=3.
function rect(x,y,w,h,fill,stroke){
  if(fill){ g.fillStyle=fill; g.fillRect(x,y,w,h); }
  if(stroke&&stroke!==fill){
    g.strokeStyle=stroke; g.lineWidth=1;
    g.strokeRect(x+.5,y+.5,w-1,h-1);
  }
}
function disc(cx,cy,r,fill,stroke){
  g.beginPath(); g.arc(cx,cy,r,0,7);
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=1; g.stroke(); }
}
function tri(pts,c){
  g.beginPath(); g.moveTo(pts[0],pts[1]); g.lineTo(pts[2],pts[3]); g.lineTo(pts[4],pts[5]);
  g.closePath(); g.fillStyle=c; g.fill();
}
function line(x1,y1,x2,y2,c){
  g.strokeStyle=c; g.lineWidth=1;
  g.beginPath(); g.moveTo(x1+.5,y1+.5); g.lineTo(x2+.5,y2+.5); g.stroke();
}

// mirrors ctlColour()
function ctlColour(vis){
  switch(vis){
    case 'pressed':  return {fill:C.TEXT,     edge:C.TEXT,     fg:C.BG};
    case 'active':   return {fill:C.ACCENT,   edge:C.ACCENT,   fg:C.BG};
    case 'activeOff':return {fill:C.NEUTRAL,  edge:C.NEUTRAL,  fg:C.BG};
    case 'activeBri':return {fill:C.BRI,      edge:C.BRI,      fg:C.BG};
    case 'disabled': return {fill:C.BG,       edge:C.BG,       fg:C.DISABLED};
    case 'err':      return {fill:C.BG,       edge:C.ERROR,    fg:C.ERROR};
    default:         return {fill:C.ELEVATED, edge:C.ELEVATED, fg:C.TEXT2};
  }
}
function wChip(r,label,alt,vis,what){
  const c=ctlColour(vis);
  rect(r.x,r.y,r.w,r.h,c.fill,c.edge);
  textFit('BODY',label,alt,r.x+r.w/2,r.y+r.h/2,r.w-2*SP_1,c.fg,what);
}
function wStepBtn(r,up,vis){
  const c=ctlColour(vis==='active'?'inactive':vis);
  rect(r.x,r.y,r.w,r.h,c.fill,c.edge);
  // Up is C.ERROR (red, reused), down is C.DOWN (its own vivid-blue token —
  // C.COOL is deliberately pale, matching a bulb's ~4000K appearance, which
  // read as muted rather than "popping" here) — but only at rest; pressed
  // and disabled still take c.fg, same as screen.cpp.
  const chevFg=(vis==='pressed'||vis==='disabled')?c.fg:(up?C.ERROR:C.DOWN);
  // Rotated 90 deg from the plain up/down glyph — right for warmer, left for
  // cooler — on request, so the stepper doesn't read as the scroll gutter's
  // arrows in miniature. See screen.cpp's wStepBtn.
  icoChevron(r.x+r.w/2,r.y+r.h/2,up?'right':'left',chevFg,6,4);
}
function wSwatch(cx,cy,r,colour,vis){
  if(vis==='active'){ disc(cx,cy,r-2,colour); disc(cx,cy,r,null,colour); }
  else if(vis==='pressed') disc(cx,cy,r-2,C.TEXT);
  else if(vis==='disabled') disc(cx,cy,r-2,null,C.DISABLED);
  else { disc(cx,cy,r-2,tint(colour)); disc(cx,cy,r-2,null,mix(C.BG,colour,150/255)); }
}
function wToggle(x,y,w,h,on){
  const k=h-2*TGL_PAD;                 // square knob in a square track
  if(on){ rect(x,y,w,h,C.ACCENT,null);   rect(x+w-TGL_PAD-k,y+TGL_PAD,k,k,C.BG,null); }
  else  { rect(x,y,w,h,C.ELEVATED,null); rect(x+TGL_PAD,y+TGL_PAD,k,k,C.TEXT3,null); }
}
// Mirrors the firmware's snprintf("%.0f", target). String(d.target) is NOT the
// same thing: a 0.5 target_temp_step is real (the poll carries tenths precisely
// so a 24.5 setpoint survives), and the panel draws that as "24" while
// String() would draw "24.5" and report a false 58px-of-44px overflow.
// C's %.0f rounds half to EVEN, so 24.5 -> "24" and 25.5 -> "26"; Math.round
// would give 25 and 26 and disagree on exactly the values that occur.
function fmt0(v){
  const f=Math.floor(v), d=v-f;
  const n = d>0.5 ? f+1 : d<0.5 ? f : (f%2===0 ? f : f+1);
  return String(n);
}
function wValue(r,val,degree,fg,bg){
  g.fillStyle=bg; g.fillRect(r.x,r.y,r.w,r.h);
  const vw=textW('NUM',val), degW=degree?9:0, cy=r.y+r.h/2;
  const bx=r.x+Math.round((r.w-(vw+degW))/2);
  if(vw+degW>r.w) warn(`AC setpoint "${val}" needs ${vw+degW}px of ${r.w}px`);
  gtext('NUM',val,bx,cy,'left',fg);
  if(degree){
    const ry=cy+INK_TOP.NUM+3;
    disc(bx+vw+5,ry,3,null,fg); disc(bx+vw+5,ry,2,null,fg);
  }
}
// The bar is flush with the TOP of the rect, which is what seats it on the
// header rule now that the header sits at the bottom of the screen (the rule
// is at the top of the band, not the bottom); it spans the word rather than
// the cell.
function wTab(x,y,w,h,label,vis){
  const sel=(vis==='active'||vis==='pressed');
  // MICRO, not BODY — mirrors wTab() in widgets.cpp: the tab label dropped one
  // font size, on request, to buy room for TAB_GAP between tabs.
  textFit('MICRO',label,null,x+w/2,y+h/2,w-2*TAB_LBL_DX,sel?C.TEXT:C.TEXT3,'tab');
  if(!sel) return;
  const uw=Math.min(textW('MICRO',label)+2*TAB_UL_PAD,w);
  g.fillStyle=vis==='pressed'?C.TEXT:C.ACCENT;
  g.fillRect(x+Math.floor((w-uw)/2),y,uw,TAB_UL_H);
}

// ── icons: same construction as src/ui/icons.cpp ─────────────────────────────
function icoBulb(cx,cy,c,filled){
  const gy=cy-2;
  disc(cx,gy,5,filled?c:null,filled?null:c);
  g.fillStyle=c;
  g.fillRect(cx-3,cy+4,7,2); g.fillRect(cx-2,cy+6,5,1);
}
function icoSnow(cx,cy,c){
  line(cx,cy-6,cx,cy+6,c); line(cx-5,cy-3,cx+5,cy+3,c); line(cx-5,cy+3,cx+5,cy-3,c);
  g.fillStyle=c; g.fillRect(cx-2,cy-4,5,1); g.fillRect(cx-2,cy+4,5,1);
}
function icoDrop(cx,cy,c){
  tri([cx,cy-7,cx-5,cy+1,cx+5,cy+1],c); disc(cx,cy+1,5,c);
}
function arc(cx,cy,r,a0,a1,c){
  g.strokeStyle=c; g.lineWidth=1; g.beginPath(); g.arc(cx,cy,r,a0,a1); g.stroke();
}
function icoPower(cx,cy,c){
  arc(cx,cy+1,6,0,Math.PI,c);
  g.fillStyle=c; g.fillRect(cx-6,cy-2,1,4); g.fillRect(cx+6,cy-2,1,4);
  g.fillRect(cx,cy-7,1,6);
}
function icoSun(cx,cy,c){
  disc(cx,cy,3,c); g.fillStyle=c;
  g.fillRect(cx,cy-7,1,3); g.fillRect(cx,cy+5,1,3);
  g.fillRect(cx-7,cy,3,1); g.fillRect(cx+5,cy,3,1);
  for(const [dx,dy] of [[-5,-5],[5,-5],[-5,5],[5,5]]) g.fillRect(cx+dx,cy+dy,1,1);
}
function icoMoon(cx,cy,c,bg){ disc(cx-1,cy,7,c); disc(cx+4,cy-3,6,bg); }
function icoClock(cx,cy,c){
  disc(cx,cy,7,null,c); g.fillStyle=c;
  g.fillRect(cx,cy-4,1,5); g.fillRect(cx,cy,4,1);
}
function icoRotate(cx,cy,c){
  arc(cx,cy,6,Math.PI,0,c); arc(cx,cy,6,0,Math.PI,c);
  tri([cx+3,cy-1,cx+8,cy-1,cx+6,cy+4],c);
  tri([cx-3,cy+1,cx-8,cy+1,cx-6,cy-4],c);
}
// Mirrors icoSpeaker() in icons.cpp: level 0 is a cross, 1..3 that many waves.
function icoSpeaker(cx,cy,c,level){
  g.fillStyle=c; g.fillRect(cx-7,cy-2,3,5);
  tri([cx-5,cy,cx-1,cy-5,cx-1,cy+5],c);
  if(level===0){ line(cx+1,cy-3,cx+7,cy+3,c); line(cx+1,cy+3,cx+7,cy-3,c); return; }
  for(let i=0;i<level&&i<3;i++) arc(cx,cy,3+2*i,-Math.PI/2,Math.PI/2,c);
}
function icoChevron(cx,cy,dir,c,hw,hh){
  // dir: 'up'/'down'/'left'/'right'. hw is the base half-length (perpendicular
  // to the point), hh the apex offset from centre along the point — passing
  // the same two numbers into a rotated dir rotates this triangle with them.
  const pts={
    up:   [cx-hw,cy+hh,cx+hw,cy+hh,cx,cy-hh],
    down: [cx-hw,cy-hh,cx+hw,cy-hh,cx,cy+hh],
    right:[cx-hh,cy-hw,cx-hh,cy+hw,cx+hh,cy],
    left: [cx+hh,cy-hw,cx+hh,cy+hw,cx-hh,cy],
  }[dir];
  tri(pts,c);
}

// ── derived appearance, mirroring screen.cpp ─────────────────────────────────
function bulbHue(d){
  if(!d.ct || !(d.kelvin>0)) return C.TEXT2;
  let t=Math.round((d.kelvin-KELVIN_WARM)*255/(KELVIN_COOL-KELVIN_WARM));
  t=Math.max(0,Math.min(255,t));
  return mix(C.WARM,C.COOL,t/255);
}
function iconVis(d,stale){
  // An offline device is not ALSO dimmed: red outranks stale.
  if(!d.known || !d.avail)
    return {shape:d.kind==='climate'?'power':'bulbOff', colour:d.known?C.ERROR:C.DISABLED};
  let v;
  if(d.kind==='climate'){
    if(d.mode==='cool')      v={shape:'snow', colour:C.ACCENT};
    else if(d.mode==='dry')  v={shape:'drop', colour:C.ACCENT};
    else if(d.mode==='off')  v={shape:'power',colour:C.DISABLED};
    // POWER, not a snowflake: a snowflake beside the word HEAT is simply wrong.
    else                     v={shape:'power',colour:C.TEXT2};
  }
  else if(!d.on) v={shape:'bulbOff', colour:C.DISABLED};
  else {
    const hue=bulbHue(d);
    v={shape:'bulbOn',
       colour:(d.pct>=0&&d.pct<BRI_HIGH)?mix(C.BG,hue,(70+d.pct*185/100)/255):hue};
  }
  // Same fail-soft rule as the state text: keep the reading, dim it once stale.
  if(stale) v.colour=mix(C.BG,v.colour,110/255);
  return v;
}
function drawIcon(v,cx,cy){
  switch(v.shape){
    case 'bulbOn': icoBulb(cx,cy,v.colour,true); break;
    case 'snow':   icoSnow(cx,cy,v.colour); break;
    case 'drop':   icoDrop(cx,cy,v.colour); break;
    case 'power':  icoPower(cx,cy,v.colour); break;
    default:       icoBulb(cx,cy,v.colour,false);
  }
}
// AC ONLY. Used to feed the AC card's identity column (two short lines under
// the name); that moved to the header on request (STATUS_ROOM_W, drawStatus()
// below) so it reads on every page, not just Devices. Two things a
// card-based version of this used to also do are gone rather than left
// unreachable: the "OFFLINE" word (the border/icon/name colour already carry
// that, same as a bulb) and naming an exceptional mode (heat/fan_only/auto —
// the icon falls back to a plain power glyph for those now).
function roomTempText(d){
  if(!d.known||!d.avail||d.room==null) return {s:'--',deg:false};
  return {s:`${d.room}`,deg:true};
}
// Digits only — the "%" is drawn separately and a size smaller by
// drawStatusRoom(), mirroring the firmware. Still the whole string the dirty
// compare keys on there, so the split costs that nothing.
function humidityText(d){
  if(!d.known||!d.avail||d.humidity==null) return '';
  return `${d.humidity}`;
}

// ── pages ────────────────────────────────────────────────────────────────────
// One card, so the Scenes page can draw the AC's without the Devices loop —
// mirroring drawDeviceCard() in screen_devices.cpp, which likewise has two
// callers on two pages now. Nothing in here is page-aware: the geometry comes
// from cardTop(i)/btnRect(i,b), which know only the slot.
function drawDeviceCard(i){
  const d=dev[i];
  const top=cardTop(i), err=isErr(), ac=(d.kind==='climate');
  // The outline is the card's alarm channel: a failed call flashes it, and an
  // OFFLINE device holds it. That second use is what replaced the word on the
  // bulb cards when their state line went away.
  const alarm=err||!d.avail;
  rect(CARD_X,top,CARD_W,CARD_H,C.BG,alarm?C.ERROR:C.BORDER);

  // Every device card is inline, sharing one identity column
  // (BULB_ID_W/BULB_NAME_W): the icon centres on CARD_H/2 on every card, and
  // a single name line shares that centre — the AC's room reading used to
  // draw two more lines here; it now lives in the header instead (see
  // drawStatusRoom() below), so the AC's identity column matches a bulb's.
  const idCy=top+CARD_H/2;
  drawIcon(iconVis(d,stale),CARD_ICO_CX,idCy);

  // The name takes the alarm colour on every card kind now — the only text
  // left to carry that once OFFLINE (or an AC's exceptional-mode name) is gone.
  const nameFg=alarm?C.ERROR:(stale?C.DIM:C.TEXT);
  textTrunc('TITLE',d.name,CARD_TXT_X,idCy,BULB_NAME_W,nameFg,`row ${i} name`);

  const acOff=d.kind==='climate'&&d.mode==='off';
  for(let b=0;b<btnCount(d);b++){
    const r=btnRect(i,b), isSw=(d.kind==='light'&&b>=4), isAc=(d.kind==='climate');
    const isAcTemp=isAc&&(b===AC_BTN_TUP||b===AC_BTN_TDN);
    const dis=!d.avail||(isSw&&!d.ct)||(isAcTemp&&acOff);
    // Slot 0 is OFF on both card kinds and takes the neutral highlight, not
    // the accent. A bulb's 1%/30%/100% chip (not the AC's mode chips, not a
    // swatch) takes the yellow activeBri highlight instead — scoped to this
    // one control on request. Mirrors drawDeviceCard().
    const vis=dis?'disabled':
      (btnActive(d,b)?(b===0?'activeOff':(!isAc&&!isSw?'activeBri':'active')):'inactive');
    if(d.kind==='climate'){
      if(b===AC_BTN_TUP||b===AC_BTN_TDN) wStepBtn(r,b===AC_BTN_TUP,vis);
      else if(b===AC_BTN_TEMP){
        const known=d.known&&d.avail&&d.target!=null;
        // Greyed the same as the disabled chevrons beside it when the AC is
        // off — mirrors drawDeviceCard()'s region 3.
        wValue(r,known?fmt0(d.target):'--',known,
               (err||!d.avail)?C.ERROR:(acOff?C.DISABLED:(stale?C.DIM:C.TEXT)),C.BG);
      }
      else wChip(r,AC_LABEL[b],null,vis,`AC chip ${b}`);
    }
    else if(isSw) wSwatch(r.x+r.w/2,r.y+r.h/2,SW_R,b===4?C.WARM:C.COOL,vis);
    else wChip(r,BULB_LABEL[b],BULB_LABEL_ALT[b],vis,`row ${i} chip ${b}`);
    if(r.x+r.w-1>CARD_IN_X1) warn(`row ${i} slot ${b} runs past the card inner edge (${r.x+r.w-1} > ${CARD_IN_X1})`);
  }
}

function drawDevices(){
  for(let i=0;i<dev.length;i++){
    if(i===0 && noConnShown()) continue;   // band 0 belongs to the banner
    drawDeviceCard(i);
  }
}

function drawSceneTile(slot,idx){
  const x=sceneTileX(slot), y=sceneTileY(slot);
  if(idx>=SCENE.length) return;   // empty slot: cleared, nothing drawn

  const unavail=dev.slice(0,NUM_BULBS).some(d=>!d.known||!d.avail);
  let fill,edge,fg,mono=true;
  if(unavail){ fill=C.SURFACE; edge=C.SURFACE; fg=C.DISABLED; }
  else if(isErr()){ fill=C.SURFACE; edge=C.ERROR; fg=C.ERROR; }
  else if(sceneActive(idx)){ fill=tint(C.ACCENT); edge=C.ACCENT; fg=C.ACCENT; mono=false; }
  else { fill=C.SURFACE; edge=C.BORDER; fg=C.TEXT2; mono=false; }

  rect(x,y,SCENE_TILE_W,SCENE_TILE_H,fill,edge);

  const sc=SCENE[idx], cx=x+SCENE_TILE_W/2, py=y+SCENE_PIP_DY;
  for(let i=0;i<NUM_BULBS;i++){
    const px=cx+(i-1)*SCENE_PIP_GAP, b=sc.b[i];
    if(!b.on){ disc(px,py,SCENE_PIP_R,null,mono?fg:C.DISABLED); continue; }
    let c = mono ? fg
          : !b.kelvin                 ? C.TEXT2
          : b.kelvin<=KELVIN_WARM_MAX ? C.WARM : C.COOL;
    if(!mono && b.pct<BRI_HIGH) c=mix(fill,c,(70+b.pct*185/100)/255);
    disc(px,py,SCENE_PIP_R,c);
  }
  textFit('TITLE',sc.name,null,cx,y+SCENE_NAME_DY,SCENE_TILE_W-2*SP_2,fg,`scene "${sc.name}"`);

  if(x+SCENE_TILE_W>SCENE_SB_X0) warn(`tile ${slot} reaches into the scroll gutter`);
  if(y+SCENE_TILE_H>SCENE_AC_Y0) warn(`tile ${slot} runs into the AC card's band (ends ${y+SCENE_TILE_H}, band starts ${SCENE_AC_Y0})`);
}

function drawSceneScrollbar(){
  const maxRow=sceneMaxRow();
  if(maxRow===0) return;                       // empty gutter, dead to taps
  // The GRID's bottom edge, not the body's: the AC card below runs to x 311 and
  // so passes under this column, and in the firmware each region clears only its
  // own rect. Its down chevron's ink lands in the blank band, which is fine —
  // the gutter owns that rect.
  const cx=SCENE_SB_X0+SCENE_SB_W/2, bot=SCENE_AC_Y0-1;
  icoChevron(cx,ROWS_Y0+13,'up',   sceneRow===0     ?C.DISABLED:C.TEXT2,6,5);
  icoChevron(cx,bot-13,   'down', sceneRow>=maxRow ?C.DISABLED:C.TEXT2,6,5);

  const tY=ROWS_Y0+SP_6, tH=(bot-SP_6)-tY;
  g.fillStyle=C.DIVIDER; g.fillRect(cx,tY,1,tH);
  let th=Math.floor(tH*SCENE_VIS_ROWS/sceneRowsN());
  if(th<10) th=10;
  rect(cx-2,tY+Math.floor((tH-th)*sceneRow/maxRow),5,th,C.ACCENT,null);
}

function drawScenes(){
  const base=sceneRow*SCENE_COLS;
  for(let slot=0;slot<SCENE_PER_PAGE;slot++){
    // The top tile row shares band 0 with the connectivity banner, which owns it
    // while shown — including across a scroll, which repaints every tile.
    if(slot<SCENE_COLS && noConnShown()) continue;
    drawSceneTile(slot,base+slot);
  }
  drawSceneScrollbar();
  // The AC card, in the row band below the grid — the SAME card the Devices
  // page draws, at the same rect, so it is drawn through the same function
  // rather than reimplemented. Not skipped for noConnShown(): the banner owns
  // row band 0 and this is the last band.
  drawDeviceCard(SCENE_AC_SLOT);
}

function tglVal(t){ return t===SET_TGL_SCHED?set.nightSched:set.flip; }
function setIcon(row,cx,cy){
  if(row===SET_ROW_BRI)        icoSun(cx,cy,C.TEXT2);
  else if(row===SET_ROW_NIGHT) icoMoon(cx,cy,C.TEXT2,C.SURFACE);
  else if(row===SET_ROW_VOL)   icoSpeaker(cx,cy,C.TEXT2,set.volIdx);
}
function drawSettings(){
  for(let r=0;r<SET_ROWS;r++){
    // SET_ROW_BRI is 0, so the brightness card shares band 0 with the banner and
    // is skipped whole while it shows. The other rows still draw — and they are
    // the ones that still work, since no Settings row touches HA.
    if(r===SET_ROW_BRI && noConnShown()) continue;
    const top=cardTop(r);
    if(r===SET_ROW_TGL){
      // Two half-width cards — mirrors drawSettingChrome()'s SET_ROW_TGL branch.
      for(let t=0;t<SET_TGLS;t++){
        const x=CARD_X+t*TGL_CARD_PITCH, cy=top+CARD_H/2;
        rect(x,top,TGL_CARD_W,CARD_H,C.SURFACE,C.BORDER);
        if(t===SET_TGL_SCHED) icoClock(x+(CARD_ICO_CX-CARD_X),cy,C.TEXT2);
        else                  icoRotate(x+(CARD_ICO_CX-CARD_X),cy,C.TEXT2);
        const tx=x+(CARD_TXT_X-CARD_X);
        gtext('TITLE',TGL_LABEL[t],tx,cy,'left',C.TEXT);
        // The title's budget is the text column to SP_2 short of the toggle.
        // A fit failure here is not silent-but-safe like textFit(): the title
        // is drawn untruncated and would run under the toggle.
        if(tx+textW('TITLE',TGL_LABEL[t])>x+TOGGLE_DX-SP_2)
          warn(`settings toggle ${t}: title "${TGL_LABEL[t]}" reaches the toggle`);
        wToggle(x+TOGGLE_DX,top+TOGGLE_DY,TOGGLE_W,TOGGLE_H,tglVal(t));
      }
      continue;
    }
    rect(CARD_X,top,CARD_W,CARD_H,C.SURFACE,C.BORDER);
    setIcon(r,CARD_ICO_CX,top+CARD_L1_CY);
    gtext('TITLE',SET_LABEL[r],CARD_TXT_X,top+CARD_L1_CY,'left',C.TEXT);
    if(r===SET_ROW_BRI){
      gtext('BODY',BRI_LABEL[set.briIdx],CARD_IN_X1,top+CARD_L1_CY,'right',C.TEXT2);
      for(let b=0;b<BRI_STEPS;b++){
        const q=briRect(b);
        wChip(q,BRI_LABEL[b],null,b===set.briIdx?'active':'inactive',`brightness ${b}`);
        if(q.x+q.w-1>CARD_IN_X1) warn(`brightness ${b} runs past the card inner edge (${q.x+q.w-1} > ${CARD_IN_X1})`);
      }
    } else if(r===SET_ROW_NIGHT){
      for(let c=0;c<NIGHT_CHIPS;c++){
        const q=nightRect(c);
        wChip(q,NIGHT_LABEL[c],null,NIGHT_CHIP_MODE[c]===set.nightMode?'active':'inactive',`night ${c}`);
        if(q.x+q.w-1>CARD_IN_X1) warn(`night mode chip ${c} runs past the card inner edge (${q.x+q.w-1} > ${CARD_IN_X1})`);
      }
    } else {
      gtext('BODY',VOL_LABEL[set.volIdx],CARD_IN_X1,top+CARD_L1_CY,'right',C.TEXT2);
      for(let v=0;v<VOL_STEPS;v++){
        const q=volRect(v);
        wChip(q,VOL_LABEL[v],null,v===set.volIdx?'active':'inactive',`volume ${v}`);
        if(q.x+q.w-1>CARD_IN_X1) warn(`volume ${v} runs past the card inner edge (${q.x+q.w-1} > ${CARD_IN_X1})`);
      }
    }
  }
}

// Mirrors tabRect() in screen.cpp: each tab's cell hugs its OWN label (measured
// via textW, not a shared width constant), and the strip is CENTRED in
// TAB_STRIP_W starting at TAB_X0 (80), between the room reading on the left
// and the clock on the right. The leftover after 3 content-fit cells + 2 gaps
// is split evenly into two outer margins.
let _tabCells=null;
function tabRect(i){
  if(!_tabCells){
    const w=TAB_LABEL.map(t=>textW('MICRO',t)+2*TAB_LBL_DX);
    const total=w.reduce((a,b)=>a+b,0)+(TAB_COUNT-1)*TAB_GAP;
    let cx=TAB_X0+Math.floor((TAB_STRIP_W-total)/2);
    _tabCells=w.map(cw=>{ const cell={x:cx,w:cw}; cx+=cw+TAB_GAP; return cell; });
    if(total>TAB_STRIP_W) warn(`tab labels (${total}px incl. gaps) overrun the ${TAB_STRIP_W}px strip`);
  }
  return _tabCells[i];
}

// Mirrors drawStatusRoom() in screen.cpp: <temp><ring> <humidity>%, left-aligned
// STATUS_EDGE_DX in from the screen edge, immediately before the tab strip.
// dev[NUM_BULBS] is the AC (config.h), same assumption the firmware makes.
//
// The numbers are NUM; the "%" stays TITLE and rides the big digits' BASELINE
// (BASE.NUM - BASE.TITLE), since an M* datum centres each role on its own box and
// the same cy would leave it floating mid-height. The old trailing "/" is gone.
// A reading too wide for the region drops its digits to TITLE (see the firmware).
function roomReadingW(role,room,hum){
  return textW(role,room.s)+(room.deg?5:0)+SP_1+(hum?textW(role,hum)+textW('TITLE','%'):0);
}
function drawStatusRoom(){
  const d=dev[NUM_BULBS], err=isErr();
  const fg=(err||!d.avail)?C.ERROR:(stale?C.DIM:C.TEXT2);
  const room=roomTempText(d), hum=humidityText(d);
  const role=roomReadingW('NUM',room,hum)<=STATUS_ROOM_W-STATUS_EDGE_DX?'NUM':'TITLE';
  if(role!=='NUM')
    warn(`header room reading "${room.s}/${hum}" too wide at NUM — drawn in TITLE`);
  const pctCy=STATUS_CY+(BASE[role]-BASE.TITLE);
  let x=STATUS_EDGE_DX;
  gtext(role,room.s,x,STATUS_CY,'left',fg);
  x+=textW(role,room.s);
  if(room.deg){ disc(x+3,STATUS_CY+INK_TOP[role]+2,2,null,fg); x+=5; }
  x+=SP_1;
  if(hum){
    gtext(role,hum,x,STATUS_CY,'left',fg);
    x+=textW(role,hum);
    gtext('TITLE','%',x,pctCy,'left',fg);
    x+=textW('TITLE','%');
  }
  if(x>STATUS_ROOM_W)
    warn(`header room reading runs into the tab strip (ends x=${x}, tab strip starts ${TAB_X0})`);
}

function draw(){
  warnings=[];
  applyTheme(set.nightMode);
  const ladder=checkNightLadder();
  const shiftLadder=checkShiftDistinct();
  g.fillStyle=C.BG; g.fillRect(0,0,SCR_W,SCR_H);

  // header: room reading | tabs | clock, tiling the bar exactly
  // The cell is the clear rect in drawTab(), and handing it to wTab is what puts
  // the underline on the first row below the rule.
  drawStatusRoom();

  for(let i=0;i<TAB_COUNT;i++){
    const cell=tabRect(i);
    wTab(cell.x,STATUS_DIV_Y+1,cell.w,STATUS_H-1,
         TAB_LABEL[i], i===page?'active':'inactive');
  }

  // 24h clock in Asia/Bangkok, matching the firmware's NTP + TZ_INFO="ICT-7".
  // NUM, same as the room reading on the other side.
  const clk=new Date().toLocaleTimeString('en-GB',
              {timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit'});
  gtext('NUM',clk,SCR_W-STATUS_EDGE_DX,STATUS_CY,'right',C.TEXT);
  const clkW=textW('NUM',clk), clkLeft=(SCR_W-STATUS_EDGE_DX)-clkW;
  if(clkLeft < SCR_W-STATUS_CLK_W)
    warn(`clock "${clk}" (${clkW}px) starts at x=${clkLeft}, inside the tab strip (starts ${TAB_X0+TAB_STRIP_W})`);
  // The live clock is always "HH:MM"-shaped, so check the pre-NTP placeholder too
  // — it is the one clock string the browser will never hand us.
  if((SCR_W-STATUS_EDGE_DX)-textW('NUM','--:--') < SCR_W-STATUS_CLK_W)
    warn(`clock placeholder "--:--" (${textW('NUM','--:--')}px) starts inside the tab strip`);
  g.fillStyle=C.DIVIDER; g.fillRect(0,STATUS_DIV_Y,SCR_W,1);

  if(page===PAGE_SCENES)        drawScenes();
  else if(page===PAGE_SETTINGS) drawSettings();
  else                          drawDevices();

  // LAST, and over the page: it is an overlay on whatever was just drawn. The
  // firmware needs a dirty-compare and an invalidate on the falling edge to
  // restore the content underneath (see drawNoConn(), screen.cpp); here draw()
  // repaints the whole canvas every call, so an unconditional draw is enough.
  if(noConnShown()){
    // The CURRENT PAGE's first row, because the two grids don't share a pitch: a
    // 52px band leaves 12px of a 64px scene tile showing. On Scenes it also stops
    // at the scroll gutter, which is its own region — clearing across it erased
    // the up arrow, and in the firmware nothing would have put it back.
    const scenes=(page===PAGE_SCENES);
    g.fillStyle=C.BG;
    g.fillRect(0,rowTop(0),scenes?SCENE_SB_X0:SCR_W,scenes?SCENE_TILE_H:ROW_H);
    wChip({x:NOCONN_X0,y:NOCONN_Y0,w:NOCONN_W,h:NOCONN_H},
          'No Connection',null,'err','connectivity overlay');
  }

  // ── the same static_asserts screen.cpp makes ──
  // TAB_STRIP_W is DERIVED from STATUS_ROOM_W and STATUS_CLK_W (see its const
  // above), so "room reading + tabs + clock = SCR_W" cannot go wrong. tabRect()
  // warns separately if the labels ever overrun TAB_STRIP_W.
  // The banner must sit wholly inside the band it clears — the band is what
  // removes the content underneath, so anything hanging out of it would be drawn
  // over pixels nothing cleared, which is the fragment problem it exists to fix.
  if(NOCONN_Y0 < ROWS_Y0 || NOCONN_Y0+NOCONN_H > ROWS_Y0+ROW_H)
    warn(`no-connection banner y${NOCONN_Y0}..${NOCONN_Y0+NOCONN_H-1} hangs out of band 0 (${ROWS_Y0}..${ROWS_Y0+ROW_H-1})`);
  if(NOCONN_X0 < 0 || NOCONN_X0+NOCONN_W > SCR_W) warn('no-connection banner is wider than the screen');
  if(textW('BODY','No Connection') > NOCONN_W-2*SP_1)
    warn(`"No Connection" (${textW('BODY','No Connection')}px) does not fit the banner's ${NOCONN_W-2*SP_1}px budget`);
  if(TAB_UL_Y<=STATUS_DIV_Y) warn('tab underline overruns the header divider');
  if(TAB_UL_Y!==STATUS_DIV_Y+1) warn('the tab cell does not seat the underline at TAB_UL_Y');
  // Two things the compiler cannot see. The label's ink must stop below the bar
  // now that the bar sits ABOVE the text ("Settings" has a g, but it's the TOP
  // of the ink that matters here), and the widest label plus its bleed must
  // still fit the cell, or the bar would be clamped and stop tracking the word.
  // MICRO, not BODY — the tab label's font, per wTab() above.
  if(STATUS_CY+INK_TOP.MICRO <= TAB_UL_Y+TAB_UL_H)
    warn(`tab label ink starts y${STATUS_CY+INK_TOP.MICRO}, underline ends y${TAB_UL_Y+TAB_UL_H}`);
  // Cells are content-fit now (tabRect()), so a label can never overrun its
  // OWN cell by construction — the only residual thing to check is that the
  // underline (label + 2*TAB_UL_PAD) doesn't spill past that same cell.
  TAB_LABEL.forEach((t,i)=>{
    const cell=tabRect(i);
    if(textW('MICRO',t)+2*TAB_UL_PAD > cell.w)
      warn(`tab "${t}" underline (${textW('MICRO',t)+2*TAB_UL_PAD}px) is wider than its ${cell.w}px cell`);
  });
  if(ROWS_Y0+NUM_DEVICES*ROW_H!==STATUS_Y0)
    warn(`rows do not fill the body (${ROWS_Y0+NUM_DEVICES*ROW_H} of ${STATUS_Y0})`);
  if(CARD_L1_Y+CARD_L1_H>CTL_DY) warn('card line 1 overlaps the control row');
  if(CTL_DY+CTL_H>CARD_H) warn('control row overruns the card');
  if(BULB_CTL_X0+4*BULB_CHIP_PITCH-CHIP_GAP+2*SW_CELL_W!==CARD_IN_X1+1)
    warn('bulb row does not fill the card');
  if(BULB_CTL_DY+BULB_CTL_H>CARD_H) warn('inline bulb control row overruns the card');
  if(BULB_NAME_W<=0) warn('bulb identity column has no room for a name');
  // The inline row puts the icon and the name INSIDE the band the controls
  // occupy, so both have to fit it vertically — a check the stacked card never
  // needed, because its line had a whole strip to itself.
  {
    const cy=CARD_H/2;
    if(cy-CARD_ICO_R<BULB_CTL_DY || cy+CARD_ICO_R>=BULB_CTL_DY+BULB_CTL_H)
      warn(`bulb icon (y+${cy-CARD_ICO_R}..${cy+CARD_ICO_R}) leaves its row band y+${BULB_CTL_DY}..${BULB_CTL_DY+BULB_CTL_H-1}`);
    if(cy+INK_TOP.TITLE<BULB_CTL_DY || cy+INK_BOT.TITLE>=BULB_CTL_DY+BULB_CTL_H)
      warn(`bulb name ink (y+${cy+INK_TOP.TITLE}..${cy+INK_BOT.TITLE}) leaves its row band`);
    // The identity column's clear rect must stop before the first chip, or a
    // repaint of the name would wipe a chip nothing is going to redraw.
    if(CARD_IN_X0+BULB_ID_W>BULB_CTL_X0)
      warn('bulb identity clear rect overlaps the first chip');
  }
  // Every bulb chip label has to fit the narrower inline chip, which is the one
  // thing the width reduction could actually break. textFit() would fall back to
  // BULB_LABEL_ALT and then to F_MICRO, so this is a warning about a silent
  // downgrade rather than about clipping.
  for(const l of BULB_LABEL) if(l && textW('BODY',l)>BULB_CHIP_W-2*SP_1)
    warn(`bulb chip "${l}" (${textW('BODY',l)}px) exceeds its ${BULB_CHIP_W-2*SP_1}px label budget`);
  if(ACS_X0+2*ACS_BTN_W+ACS_VAL_W!==CARD_IN_X1+1)
    warn('AC control row does not fill the card');
  // AC mode chips narrowed 60->43 to make room for the identity column — check
  // the labels still fit, same as the bulb chip check above.
  for(const l of AC_LABEL) if(l && textW('BODY',l)>ACM_W-2*SP_1)
    warn(`AC chip "${l}" (${textW('BODY',l)}px) exceeds its ${ACM_W-2*SP_1}px label budget`);
  // The header's room-reading region is a reserved worst-case budget, not a
  // tiled grid (the content is proportional and optional-humidity), so this
  // checks the worst REALISTIC case fits rather than an exact equation — the
  // same kind of check the AC's identity column used to need before the
  // reading moved here. "99", not "100": an indoor AC'd bedroom sensor
  // doesn't read 100% relative humidity, so budgeting for it was the same
  // error the temperature side (2 digits, not ha.cpp's full -10..60 sanity
  // band) already knew to avoid. Mirrors drawStatusRoom()'s pieces above —
  // NUM digits, a TITLE "%", no "/" — with worst-case inputs rather than
  // whatever the current dev[3] shows.
  {
    const roomW=roomReadingW('NUM',{s:'27',deg:true},'99');
    if(STATUS_EDGE_DX+roomW>STATUS_ROOM_W)
      warn(`header room reading worst case (${STATUS_EDGE_DX}+${roomW}px) exceeds its ${STATUS_ROOM_W}px region`);
    // The gap to the first tab LABEL is what separates the two blocks now that
    // the "/" is gone, and since the swap it is the tab strip's margin plus
    // TAB_LBL_DX rather than slack inside this region — so measure that.
    const toTabs=tabRect(0).x+TAB_LBL_DX-(STATUS_EDGE_DX+roomW);
    if(toTabs < SP_1)
      warn(`header room reading leaves only ${toTabs}px before "${TAB_LABEL[0]}" (want >= ${SP_1})`);
    // The out-of-range fallback has to fit too, or it would spill into the tab
    // strip — which repaints only on a tab change, so the spill would stay.
    const fbW=roomReadingW('TITLE',{s:'-10',deg:true},'100');
    if(STATUS_EDGE_DX+fbW>STATUS_ROOM_W)
      warn(`header room reading TITLE fallback "-10/100" (${fbW}px) still overruns its region`);
  }
  // VERTICAL fit, which only became a question when these two regions went to
  // F_NUM: its box is 26px against F_TITLE's 16 in a 31px band, and ROLE_DY
  // seats it 4px low. Checks the ink envelope, not the box — the box's last row
  // is always blank and text is drawn transparent, so a box overhang costs
  // nothing while an ink overhang would clip against the screen edge.
  {
    const top=STATUS_CY+INK_TOP.NUM, bot=STATUS_CY+INK_BOT.NUM;
    if(top<STATUS_DIV_Y+1 || bot>SCR_H-1)
      warn(`header F_NUM ink (y ${top}..${bot}) leaves the band y ${STATUS_DIV_Y+1}..${SCR_H-1}`);
  }
  // The grid no longer FILLS the body — the AC card owns the last row band — so
  // this is a <= bound like the x one beside it. What it still catches is the
  // grid GROWING into the card, which would leave permanently wrong pixels.
  if(ROWS_Y0+(SCENE_VIS_ROWS-1)*SCENE_PITCH_Y+SCENE_TILE_H>SCENE_AC_Y0)
    warn(`scene grid runs into the AC card's band (ends ${ROWS_Y0+(SCENE_VIS_ROWS-1)*SCENE_PITCH_Y+SCENE_TILE_H}, band starts ${SCENE_AC_Y0})`);
  if(SCENE_X0+(SCENE_COLS-1)*SCENE_PITCH_X+SCENE_TILE_W>SCENE_SB_X0)
    warn('scene grid overlaps the scroll gutter');
  if(SCENE_AC_Y0+ROW_H!==STATUS_Y0)
    warn(`the AC card's band on Scenes does not end at the header (${SCENE_AC_Y0+ROW_H} of ${STATUS_Y0})`);
  if(SCENE_AC_SLOT>=NUM_DEVICES)      warn("the Scenes page's AC slot is not a device row");
  if(SCENE_AC_SLOT!==NUM_DEVICES-1)   warn("the card copied onto Scenes is not the AC's row");
  if(SCENE_SB_MID<=ROWS_Y0||SCENE_SB_MID>=SCENE_AC_Y0)
    warn("scene scroll split is outside the gutter's own range");
  // Descenders on a STACKED card (the AC, and Settings) must stop before its
  // control row, or a lowercase name clips into the chips. Font 2 descends only
  // 7px below cy where FreeSans went 11, so this now clears by 5px rather than
  // 1 — the assert stays because the clearance is a property of the FACE, and
  // swapping the face is exactly when nobody re-checks it.
  if(CARD_L1_CY+INK_BOT.BODY >= CTL_DY)
    warn(`card line 1 descenders reach y+${CARD_L1_CY+INK_BOT.BODY}, control row starts y+${CTL_DY}`);
  if(CARD_L1_Y+CARD_L1_H < CARD_L1_CY+INK_BOT.BODY)
    warn('card line 1 dirty rect does not cover its own descenders');
  // The line must also not start ABOVE its own dirty rect, which the taller
  // FreeSans could not do and a shorter face can: ink at cy-5 against a rect
  // that starts at CARD_L1_Y would leave the tops of every name uncleared.
  if(CARD_L1_CY+INK_TOP.BODY < CARD_L1_Y)
    warn(`card line 1 ink starts y+${CARD_L1_CY+INK_TOP.BODY}, above its dirty rect at y+${CARD_L1_Y}`);

  let out=`<span class="hd">page</span> ${TAB_LABEL[page]}   `+
          `<span class="hd">body</span> ${ROWS_Y0}..${ROWS_Y0+NUM_DEVICES*ROW_H-1}\n`;
  const tabCellsStr=TAB_LABEL.map((t,i)=>{const c=tabRect(i);return `${t}:${c.x}..${c.x+c.w-1}`;}).join(' ');
  out+=`header  y ${STATUS_Y0}..${SCR_H-1} | room 0..${STATUS_ROOM_W-1} | tabs ${TAB_X0}..${TAB_X0+TAB_STRIP_W-1} [${tabCellsStr}] (${TAB_GAP}px gaps) | clock ${SCR_W-STATUS_CLK_W}..${SCR_W-1}\n`;
  {
    const roomW=STATUS_EDGE_DX+roomReadingW('NUM',{s:'27',deg:true},'99');
    out+=`  NUM    room worst ${roomW}/${STATUS_ROOM_W} (${tabRect(0).x+TAB_LBL_DX-roomW}px gap before "${TAB_LABEL[0]}") | clock "23:45" ${textW('NUM','23:45')}/${STATUS_CLK_W} | ink y ${STATUS_CY+INK_TOP.NUM}..${STATUS_CY+INK_BOT.NUM} in ${STATUS_DIV_Y+1}..${SCR_H-1}\n`;
  }
  out+=`noconn  x ${NOCONN_X0}..${NOCONN_X0+NOCONN_W-1} | y ${NOCONN_Y0}..${NOCONN_Y0+NOCONN_H-1} in band ${rowTop(0)}..${rowTop(0)+ROW_H-1} | ${haOk?'hidden (haOk)':'SHOWN, band cleared'}\n`;
  out+=`card    x ${CARD_X}..${CARD_X+CARD_W-1}, content ${CARD_IN_X0}..${CARD_IN_X1} (${CARD_IN_W}px)\n`;
  out+=`bulb    id ${CARD_IN_X0}..${BULB_CTL_X0-1} (name ${BULB_NAME_W}px) | chips ${BULB_CTL_X0}..${SW_X0-1} (${BULB_CHIP_W}x${BULB_CTL_H}) | swatches ${SW_X0}..${SW_X0+2*SW_CELL_W-1}\n`;
  out+=`ac      id ${CARD_IN_X0}..${BULB_CTL_X0-1} | chips ${BULB_CTL_X0}..${ACS_X0-1} | stepper ${ACS_X0}..${ACS_X0+2*ACS_BTN_W+ACS_VAL_W-1}\n`;
  out+=`scenes  ${SCENE.length} in ${sceneRowsN()} rows, showing ${sceneRow}..${sceneRow+SCENE_VIS_ROWS-1} of 0..${sceneMaxRow()}\n`;
  out+=`        grid x ${SCENE_X0}..${sceneTileX(SCENE_COLS-1)+SCENE_TILE_W-1} | gutter ${SCENE_SB_X0}..${SCR_W-1} (y ${ROWS_Y0}..${SCENE_AC_Y0-1}, split ${SCENE_SB_MID}) | y ${ROWS_Y0}..${sceneTileY(SCENE_PER_PAGE-1)+SCENE_TILE_H-1}\n`;
  out+=`        blank ${sceneTileY(SCENE_PER_PAGE-1)+SCENE_TILE_H}..${SCENE_AC_Y0-1} (${SCENE_AC_Y0-(sceneTileY(SCENE_PER_PAGE-1)+SCENE_TILE_H)}px, deliberate) | AC card band ${SCENE_AC_Y0}..${SCENE_AC_Y0+ROW_H-1}\n`;
  out+=`night   ${ladder}\n`;
  out+=`shift   ${shiftLadder}\n`;
  out+= warnings.length
      ? `<span class="warn">${warnings.length} issue(s):\n  ${warnings.join('\n  ')}</span>`
      : `<span class="ok">no clipping, overflow, tiling or palette issues detected</span>`;
  log.innerHTML=out;
}

// ── hit test: mirrors screenHitTest() ────────────────────────────────────────
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  let px=Math.floor((e.clientX-r.left)/S), py=Math.floor((e.clientY-r.top)/S);

  // Mirrors handleTouch(): the 180 flip is applied to the TAP, not the panel.
  if(set.flip){ px=SCR_W-1-px; py=SCR_H-1-py; }

  // Tabs are the only live region at/below STATUS_Y0, now that the header sits
  // at the bottom of the screen.
  if(py>=STATUS_Y0){
    // Mirrors screenHitTest(): cells are content-fit and unevenly spaced
    // (tabRect()), so a tap in TAB_GAP or either outer margin is a genuine
    // miss rather than snapping to a neighbour.
    for(let i=0;i<TAB_COUNT;i++){
      const cell=tabRect(i);
      if(px>=cell.x && px<cell.x+cell.w){ page=i; draw(); break; }
    }
    return;
  }

  if(page===PAGE_SCENES){
    // The AC card's band FIRST, and the order is load-bearing: the card spans
    // x 8..311 and so reaches into the gutter's x range (300..319), and y is the
    // only axis separating the two. Testing the gutter first would swallow every
    // tap on the card's up chevron at x 276..303.
    if(py>=SCENE_AC_Y0){ hitDeviceRow(SCENE_AC_SLOT,px); return; }
    if(px>=SCENE_SB_X0){
      const maxRow=sceneMaxRow();
      if(maxRow===0) return;                 // dead region while all scenes fit
      sceneRow = py<SCENE_SB_MID ? Math.max(0,sceneRow-SCENE_VIS_ROWS)
                                 : Math.min(maxRow,sceneRow+SCENE_VIS_ROWS);
      draw(); return;
    }
    const col=Math.floor((px-SCENE_X0)/SCENE_PITCH_X);
    const vrow=Math.floor((py-ROWS_Y0)/SCENE_PITCH_Y);
    if(col<0||col>=SCENE_COLS||vrow<0||vrow>=SCENE_VIS_ROWS) return;
    const i=(sceneRow+vrow)*SCENE_COLS+col;
    if(i>=SCENE.length) return;              // empty slot on the last page
    for(let k=0;k<NUM_BULBS;k++){            // mirrors doScene()'s optimism
      const w=SCENE[i].b[k];
      dev[k].on=w.on;
      if(w.on){ dev[k].pct=w.pct; if(w.kelvin>0&&dev[k].ct) dev[k].kelvin=w.kelvin; }
    }
    draw(); return;
  }

  if(page===PAGE_SETTINGS){
    const rw=Math.floor((py-ROWS_Y0)/ROW_H);
    if(rw<0||rw>=SET_ROWS) return;
    if(rw===SET_ROW_BRI){
      for(let b=0;b<BRI_STEPS;b++){
        const q=briRect(b);
        if(px>=q.x && px<q.x+q.w){ set.briIdx=b; draw(); return; }
      }
      return;
    }
    if(rw===SET_ROW_NIGHT){
      for(let c=0;c<NIGHT_CHIPS;c++){
        const q=nightRect(c);
        if(px>=q.x && px<q.x+q.w){ set.nightMode=NIGHT_CHIP_MODE[c]; draw(); return; }
      }
      return;
    }
    if(rw===SET_ROW_VOL){
      for(let v=0;v<VOL_STEPS;v++){
        const q=volRect(v);
        if(px>=q.x && px<q.x+q.w){ set.volIdx=v; draw(); return; }
      }
      return;
    }
    // SET_ROW_TGL: split at the gap between the two half cards.
    if(px<TGL_SPLIT_X) set.nightSched=!set.nightSched;
    else               set.flip=!set.flip;
    draw(); return;
  }

  const i=Math.floor((py-ROWS_Y0)/ROW_H);
  if(i<0||i>=dev.length) return;
  hitDeviceRow(i,px);
});

// One device row's controls, tested at a given x — mirroring screen.cpp's
// hitDeviceRow(). The caller has already established WHICH row: from the tap's
// y on Devices, or by construction on Scenes, where the AC card is pinned to
// SCENE_AC_SLOT. Factored out the moment that card appeared on a second page,
// for the same reason btnRect() is the only function that knows a row's x
// layout — two hand-written copies of "skip the setpoint, walk btnRect()" would
// be free to drift, and the one thing that must be true of this card on both
// pages is that the same pixel does the same thing.
function hitDeviceRow(i,px){
  const d=dev[i];
  for(let b=0;b<btnCount(d);b++){
    // The AC setpoint cell is a readout: a tap there is a deliberate miss.
    if(d.kind==='climate' && b===AC_BTN_TEMP) continue;
    const q=btnRect(i,b);
    if(px>=q.x && px<q.x+q.w){       // vertical band = whole row
      if(d.kind==='climate'){
        if(b===0) d.mode='off'; else if(b===1) d.mode='cool';
        else if(b===2) d.mode='dry';
        else if(d.mode!=='off') d.target += (b===AC_BTN_TUP?1:-1);
      } else {
        if(b===0) d.on=false;
        else if(b===1){d.on=true;d.pct=BRI_LOW;}
        else if(b===2){d.on=true;d.pct=BRI_MID;}
        else if(b===3){d.on=true;d.pct=BRI_HIGH;}
        else if(b===4){d.on=true;d.kelvin=KELVIN_WARM;}
        else if(b===5){d.on=true;d.kelvin=KELVIN_COOL;}
      }
      draw(); return true;
    }
  }
  return false;
}

// Deep-link a state, so a particular case can be reopened (or screenshotted)
// without clicking back to it:
//   ?page=0|1|2  &night=0|1|2  &scenes=24  &stale=1  &ha=0  &wifi=0  &bri=4  &vol=0
//   &name=Bedside+reading+lamp  &mode=heat  &avail=0  &ct=0  &hum=60
//   &room=-10  (with &hum=100, drives the header reading's TITLE fallback)
const Q=new URLSearchParams(location.search);
if(Q.has('scenes')) sceneStress(Math.max(0,+Q.get('scenes')-SCENE_BASE.length));
if(Q.has('page'))   page=Math.max(0,Math.min(2,+Q.get('page')));
if(Q.has('night'))  set.nightMode=Math.max(0,Math.min(2,+Q.get('night')));
if(Q.has('flip'))   set.flip=Q.get('flip')!=='0';
if(Q.has('bri'))    set.briIdx=Math.max(0,Math.min(BRI_STEPS-1,+Q.get('bri')));
if(Q.has('vol'))    set.volIdx=Math.max(0,Math.min(VOL_STEPS-1,+Q.get('vol')));
if(Q.has('stale'))  stale=Q.get('stale')!=='0';
if(Q.has('ha'))     haOk=Q.get('ha')!=='0';
// Mirrors updateNetState() (main.cpp): Wi-Fi going down forces haOk false,
// because servicePoll() is skipped while Wi-Fi is down and nothing else would
// ever clear it. One-directional on purpose — Wi-Fi coming back does NOT set
// haOk true, since the firmware only does that after a real successful poll.
if(Q.has('wifi'))   { wifiOk=Q.get('wifi')!=='0'; if(!wifiOk) haOk=false; }
if(Q.has('name'))   dev[0].name=Q.get('name');
if(Q.has('mode'))   dev[3].mode=Q.get('mode');
if(Q.has('avail'))  dev[1].avail=Q.get('avail')!=='0';
if(Q.has('ct'))     dev[2].ct=Q.get('ct')!=='0';
if(Q.has('hum'))     dev[3].humidity=Q.get('hum')==='-1'?null:+Q.get('hum');
if(Q.has('room'))    dev[3].room=Q.get('room')==='-'?null:Math.round(+Q.get('room'));

draw();
setInterval(()=>{ if(!isErr()) draw(); },20000);   // keep the clock live
</script>
