<!doctype html>
<meta charset="utf-8">
<title>cyd-ha layout simulator</title>
<style>
  body { background:#12151a; color:#9aa7bd; font:13px/1.5 ui-monospace,Menlo,monospace;
         margin:0; padding:24px; display:flex; gap:28px; flex-wrap:wrap; }
  canvas { image-rendering:pixelated; border:1px solid #27303f; border-radius:6px; }
  h1 { font-size:14px; color:#f2f5fa; margin:0 0 4px; letter-spacing:.08em; }
  .panel { max-width:340px; }
  .row { margin:10px 0; }
  label { display:block; color:#5c6980; font-size:11px; letter-spacing:.08em;
          text-transform:uppercase; margin-bottom:3px; }
  input[type=range] { width:100%; }
  button { background:#151b26; color:#9aa7bd; border:1px solid #27303f;
           border-radius:4px; padding:5px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:#18bcf2; color:#f2f5fa; }
  #log { white-space:pre-wrap; color:#5c6980; font-size:11px; margin-top:10px;
         min-height:5em; }
  .warn { color:#ff3b5f; }
  .ok { color:#00e17b; }
</style>

<div>
  <h1>CYD 320&times;240 &mdash; 3&times;</h1>
  <canvas id="c" width="960" height="720"></canvas>
</div>

<div class="panel">
  <h1>Simulated state</h1>
  <p>Click buttons on the canvas &mdash; this exercises the same hit-test
     geometry as <code>screenHitTest()</code>.</p>
  <div class="row">
    <button onclick="setAll(true)">all bulbs on</button>
    <button onclick="setAll(false)">all bulbs off</button>
    <button onclick="stale=!stale;draw()">toggle stale</button>
    <button onclick="haOk=!haOk;draw()">toggle HA down</button>
  </div>
  <div class="row">
    <label>Bulb 1 brightness (off-preset levels test tolerances)</label>
    <input type="range" min="0" max="100" value="30"
           oninput="dev[0].pct=+this.value;dev[0].on=+this.value>0;draw()">
  </div>
  <div class="row">
    <label>Bulb 3 colour temp</label>
    <input type="range" min="2200" max="4000" value="4000"
           oninput="dev[2].kelvin=+this.value;draw()">
  </div>
  <div id="log"></div>
</div>

<script>
// Geometry mirrors include/config.h. Keep these in sync — the whole point of
// this file is that a layout change can be checked here before flashing.
const SCR_W=320, SCR_H=240, STATUS_H=18, ROWS_Y0=20, ROW_H=55;
const ROW_LABEL_DY=1, ROW_BTN_DY=15, BTN_H=36;
const BTN_X0=6, BTN_W=48, BTN_GAP=4, BTN_PITCH=BTN_W+BTN_GAP;
const AC_BTN_W=58, AC_BTN_PITCH=AC_BTN_W+BTN_GAP;
const BULB_BTNS=6, AC_BTNS=5;

const BRI_LOW=1, BRI_MID=30, BRI_HIGH=100;
const KELVIN_WARM=2200, KELVIN_COOL=4000;
const PCT_LOW_MAX=5, PCT_MID_MIN=25, PCT_MID_MAX=35, PCT_HIGH_MIN=95;
const KELVIN_WARM_MAX=2500, KELVIN_COOL_MIN=3700;

// theme.h
const C_BG='#07090d', C_SURFACE='#151b26', C_BORDER='#27303f',
      C_TEXT='#f2f5fa', C_TEXT2='#9aa7bd', C_MUTED='#5c6980', C_DIM='#6e7a8f',
      C_GREEN='#00e17b', C_RED='#ff3b5f', C_ACCENT='#18bcf2',
      C_WARM='#ffa53c', C_COOL='#9cc8ff';

const BULB_LABEL=['OFF','1%','30%','100%',null,null];
const AC_LABEL=['OFF','AC','DRY','T+','T-'];

let stale=false, haOk=true;
let dev=[
  {name:'TRADFRI BULB 1', kind:'light',   on:true,  pct:30,  kelvin:2700, ct:true, known:true},
  {name:'TRADFRI BULB 2', kind:'light',   on:false, pct:100, kelvin:2200, ct:true, known:true},
  {name:'TRADFRI BULB 3', kind:'light',   on:true,  pct:100, kelvin:4000, ct:true, known:true},
  {name:'SENSIBO SKY AC', kind:'climate', mode:'cool', target:24, room:27,  known:true},
];

const cv=document.getElementById('c'), g=cv.getContext('2d'), S=3;
g.scale(S,S);
const log=document.getElementById('log');

function setAll(on){ dev.forEach(d=>{ if(d.kind==='light') d.on=on; }); draw(); }

function btnCount(d){ return d.kind==='climate'?AC_BTNS:BULB_BTNS; }
function rowTop(i){ return ROWS_Y0+i*ROW_H; }
function btnRect(i,b){
  const ac=dev[i].kind==='climate';
  return { x:BTN_X0+b*(ac?AC_BTN_PITCH:BTN_PITCH), y:rowTop(i)+ROW_BTN_DY,
           w:ac?AC_BTN_W:BTN_W, h:BTN_H };
}

function btnActive(d,b){
  if(d.kind==='climate'){
    if(b===0) return d.mode==='off';
    if(b===1) return d.mode==='cool';
    if(b===2) return d.mode==='dry';
    return false;
  }
  if(!d.on) return b===0;
  if(b===1) return d.pct>=0 && d.pct<=PCT_LOW_MAX;
  if(b===2) return d.pct>=PCT_MID_MIN && d.pct<=PCT_MID_MAX;
  if(b===3) return d.pct>=PCT_HIGH_MIN;
  if(b===4) return d.ct && d.kelvin>0 && d.kelvin<=KELVIN_WARM_MAX;
  if(b===5) return d.ct && d.kelvin>=KELVIN_COOL_MIN;
  return false;
}

// TFT_eSPI GLCD Font 1 is a fixed 6px advance / 8px cell — drawing char by
// char at 6px reproduces its metrics exactly, which is what makes the
// "does the name + state line fit" check here trustworthy.
function font1(text,x,y,colour,align){
  g.fillStyle=colour;
  g.font='8px ui-monospace, Menlo, monospace';
  g.textBaseline='top';
  const w=text.length*6;
  let sx = align==='right' ? x-w : align==='center' ? x-w/2 : x;
  for(let i=0;i<text.length;i++) g.fillText(text[i], sx+i*6, y);
  return w;
}
// Font 2 approximation (16px tall, proportional).
function font2w(text){ g.font='13px system-ui, sans-serif'; return g.measureText(text).width; }
function font2(text,x,y,colour){
  g.fillStyle=colour; g.font='13px system-ui, sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text,x,y); g.textAlign='left';
}

function roundRect(x,y,w,h,r,fill,stroke){
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r);
  g.closePath();
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=1; g.stroke(); }
}

let clipWarnings=[];

function drawTextButton(r,label,active){
  let fill,edge,fg;
  if(active){ fill=C_ACCENT; edge=C_ACCENT; fg=C_BG; }
  else      { fill=C_SURFACE; edge=C_BORDER; fg=C_TEXT2; }
  roundRect(r.x,r.y,r.w,r.h,4,fill,edge);
  const maxW=r.w-6;
  if(font2w(label)<=maxW) font2(label,r.x+r.w/2,r.y+r.h/2,fg);
  else {
    clipWarnings.push(`"${label}" needs ${font2w(label).toFixed(0)}px, has ${maxW}px -> falls back`);
    font1(label,r.x+r.w/2,r.y+r.h/2-4,fg,'center');
  }
}

function drawSwatch(r,colour,kLabel,active,disabled){
  let fill,edge,fg;
  if(disabled){ fill=C_BG; edge=C_BORDER; fg=C_MUTED; }
  else if(active){ fill=colour; edge=colour; fg=C_BG; }
  else { fill=mix(C_BG,colour,56/255); edge=C_BORDER; fg=colour; }
  roundRect(r.x,r.y,r.w,r.h,4,fill,edge);
  font1(disabled?'n/a':kLabel, r.x+r.w/2, r.y+r.h/2-4, fg, 'center');
}

function mix(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [ar,ag,ab]=p(a),[br,bg,bb]=p(b);
  const c=(x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,'0');
  return `#${c(ar,br)}${c(ag,bg)}${c(ab,bb)}`;
}

function stateText(d){
  if(!d.known) return '--';
  if(d.kind==='climate'){
    const m={off:'OFF',cool:'COOL',dry:'DRY'}[d.mode]||d.mode.toUpperCase();
    return `${m}  set ${d.target}  room ${d.room}`;
  }
  if(!d.on) return 'OFF';
  return d.ct && d.kelvin>0 ? `${d.pct}%  ${d.kelvin}K` : `${d.pct}%`;
}

function draw(){
  clipWarnings=[];
  g.fillStyle=C_BG; g.fillRect(0,0,SCR_W,SCR_H);

  // status bar
  const dot=(x,ok,label)=>{
    g.beginPath(); g.arc(x,STATUS_H/2,3,0,7); g.fillStyle=ok?C_GREEN:C_RED; g.fill();
    font1(label,x+7,STATUS_H/2-4,ok?C_TEXT2:C_RED);
  };
  dot(10,true,'WIFI'); dot(60,haOk,'HA');
  font1(haOk?'2s ago':'no data', SCR_W-BTN_X0, STATUS_H/2-4, haOk?C_TEXT2:C_DIM,'right');
  g.fillStyle=C_BORDER; g.fillRect(0,STATUS_H,SCR_W,1);

  dev.forEach((d,i)=>{
    const top=rowTop(i);
    if(i>0){ g.fillStyle=C_BORDER; g.fillRect(0,top-2,SCR_W,1); }

    const nameW=font1(d.name,BTN_X0,top+ROW_LABEL_DY, stale?C_DIM:C_TEXT);
    const st=stateText(d);
    const stW=st.length*6;
    font1(st,SCR_W-BTN_X0,top+ROW_LABEL_DY, stale?C_DIM:C_TEXT2,'right');
    if(BTN_X0+nameW > SCR_W-BTN_X0-stW-4)
      clipWarnings.push(`row ${i}: name+state overlap ("${d.name}" + "${st}")`);

    for(let b=0;b<btnCount(d);b++){
      const r=btnRect(i,b), active=btnActive(d,b);
      if(d.kind==='climate')  drawTextButton(r,AC_LABEL[b],active);
      else if(b===4)          drawSwatch(r,C_WARM,'2200K',active,!d.ct);
      else if(b===5)          drawSwatch(r,C_COOL,'4000K',active,!d.ct);
      else                    drawTextButton(r,BULB_LABEL[b],active);
      if(r.x+r.w > SCR_W) clipWarnings.push(`row ${i} btn ${b} overflows right edge (${r.x+r.w}px)`);
    }
  });

  const lastBottom=rowTop(3)+ROW_H;
  let out=`rows end at y=${lastBottom} of ${SCR_H}\n`;
  out+=`bulb btn right edge: ${BTN_X0+5*BTN_PITCH+BTN_W}px | AC: ${BTN_X0+4*AC_BTN_PITCH+AC_BTN_W}px\n`;
  out+= clipWarnings.length
      ? `<span class="warn">${clipWarnings.length} issue(s):\n  ${clipWarnings.join('\n  ')}</span>`
      : `<span class="ok">no clipping or overflow detected</span>`;
  log.innerHTML=out;
}

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const px=Math.floor((e.clientX-r.left)/S), py=Math.floor((e.clientY-r.top)/S);
  if(py<ROWS_Y0) return;
  const i=Math.floor((py-ROWS_Y0)/ROW_H);
  if(i<0||i>=dev.length) return;
  const d=dev[i];
  for(let b=0;b<btnCount(d);b++){
    const q=btnRect(i,b);
    // vertical band = whole row, matching screenHitTest()
    if(px>=q.x && px<q.x+q.w && py>=rowTop(i) && py<rowTop(i)+ROW_H){
      if(d.kind==='climate'){
        if(b===0) d.mode='off'; else if(b===1) d.mode='cool';
        else if(b===2) d.mode='dry';
        else d.target+= (b===3?1:-1);
      } else {
        if(b===0) d.on=false;
        else if(b===1){d.on=true;d.pct=BRI_LOW;}
        else if(b===2){d.on=true;d.pct=BRI_MID;}
        else if(b===3){d.on=true;d.pct=BRI_HIGH;}
        else if(b===4){d.on=true;d.kelvin=KELVIN_WARM;}
        else if(b===5){d.on=true;d.kelvin=KELVIN_COOL;}
      }
      draw(); return;
    }
  }
});

draw();
</script>
